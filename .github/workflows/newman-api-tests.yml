name: Newman API Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * *'

jobs:
  ecommerce-cart:
    name: Postman Newman API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman dependencies
        run: npm install

      - name: Prepare report directory
        run: mkdir -p reports

      - name: Run ecommerce cart API tests
        env:
          FOLDER_NAME_BASE64: UHJvamVjdDAyLeeUteWVhui0reeJqei9pua1geeoiw==
        run: |
          export FOLDER_NAME="$(node -e "console.log(Buffer.from(process.env.FOLDER_NAME_BASE64, 'base64').toString('utf8'))")"
          npm run test:ecommerce

      - name: Run mock order API tests
        env:
          FOLDER_NAME_BASE64: UHJvamVjdDAzLU1vY2vnlLXllYborqLljZXmjqXlj6M=
        run: |
          export FOLDER_NAME="$(node -e "console.log(Buffer.from(process.env.FOLDER_NAME_BASE64, 'base64').toString('utf8'))")"
          npm run test:mock-order

      - name: Run mock payment refund API tests
        env:
          FOLDER_NAME_BASE64: UHJvamVjdDA0LU1vY2vnlLXllYbmlK/ku5jpgIDmrL7mtYHnqIs=
        run: |
          export FOLDER_NAME="$(node -e "console.log(Buffer.from(process.env.FOLDER_NAME_BASE64, 'base64').toString('utf8'))")"
          npm run test:payment-refund

      - name: Run mock address API tests
        env:
          FOLDER_NAME_BASE64: UHJvamVjdDA1LU1vY2vnlKjmiLflnLDlnYDnrqHnkIbmtYHnqIs=
        run: |
          export FOLDER_NAME="$(node -e "console.log(Buffer.from(process.env.FOLDER_NAME_BASE64, 'base64').toString('utf8'))")"
          npm run test:address

      - name: Upload ecommerce cart HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecommerce-cart-report
          path: reports/ecommerce-cart-report.html
          if-no-files-found: error

      - name: Upload mock order HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mock-order-report
          path: reports/mock-order-report.html
          if-no-files-found: error

      - name: Upload mock payment refund HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mock-payment-refund-report
          path: reports/mock-payment-refund-report.html
          if-no-files-found: error

      - name: Upload mock address HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mock-address-report
          path: reports/mock-address-report.html
          if-no-files-found: error
